<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>축제 상세 · 축제 어때</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-root">
    <header id="site-header" class="site-header"></header>

    <main class="page-detail">
      <button class="back-link" id="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
        목록으로
      </button>

      <div class="hero-image-wrap">
        <img id="hero-img" alt="" />
      </div>

      <div class="detail-info">
        <div class="detail-title-row">
          <h1 id="festival-title"></h1>
          <span id="status-badge-container"></span>
        </div>
        <div class="detail-meta">
          <div class="detail-meta-row" id="meta-period"></div>
          <div class="detail-meta-row" id="meta-location"></div>
        </div>
        <p class="detail-description" id="festival-description"></p>
      </div>
    </main>

    <div class="fixed-cta-bar">
      <div class="fixed-cta-bar-inner">
        <button class="btn-cta" id="cta-btn">이 축제로 코스짜기</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/detail-page.js"></script>
</body>
</html>

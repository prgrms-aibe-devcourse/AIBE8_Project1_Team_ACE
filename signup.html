<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 · 축제 어때</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-root">
    <header id="site-header" class="site-header"></header>

    <main class="page-auth">
      <div class="auth-card">
        <div class="auth-logo-wrap">
          <div class="auth-logo-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </div>
          <p class="auth-title">축제 어때</p>
          <p class="auth-subtitle">계정을 만들고 나만의 축제 코스를 저장하세요</p>
        </div>

        <form id="signup-form">
          <div class="form-field">
            <label class="form-label">이메일</label>
            <input class="form-input" type="email" id="signup-email" placeholder="hello@example.com" required />
          </div>
          <div class="form-field">
            <label class="form-label">비밀번호</label>
            <input class="form-input" type="password" id="signup-pw" placeholder="8자 이상 입력해주세요" required minlength="8" />
          </div>
          <div class="form-field">
            <label class="form-label">비밀번호 확인</label>
            <input class="form-input" type="password" id="signup-pw-confirm" placeholder="비밀번호를 다시 입력해주세요" required />
          </div>
          <div class="form-field">
            <label class="form-label">닉네임</label>
            <input class="form-input" type="text" id="signup-nick" placeholder="사용할 닉네임을 입력해주세요" required />
          </div>
          <button type="submit" class="btn-primary">가입하기</button>
        </form>

        <p class="auth-footer">
          이미 계정이 있으신가요?
          <button class="auth-footer-link" id="to-login">로그인</button>
        </p>
      </div>
    </main>
  </div>

  <script src="js/supabase/config.local.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1"></script>
  <script src="js/supabase/client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/signup-page.js"></script>
</body>
</html>

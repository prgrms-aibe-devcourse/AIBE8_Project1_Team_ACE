<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>축제 어때</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-root">
    <header id="site-header" class="site-header"></header>

    <main class="page-main">
      <!-- Filter bar -->
      <div class="filter-bar">
        <select class="filter-select" id="area-filter">
          <option value="all">전체 ▾</option>
          <option value="서울특별시">서울특별시</option>
          <option value="경기">경기</option>
          <option value="강원">강원</option>
          <option value="부산">부산</option>
          <option value="울산">울산</option>
          <option value="광주">광주</option>
          <option value="전북">전북</option>
          <option value="경상북도">경상북도</option>
          <option value="경상남도">경상남도</option>
          <option value="충청남도">충청남도</option>
        </select>
        <select class="filter-select" id="period-filter">
          <option value="all">전체 ▾</option>
          <option value="week">이번주</option>
        </select>
        <div class="tag-group">
          <button id="tour-btn" class="tag-btn" value="tour">#문화관광</button>
          <button id="culture-btn" class="tag-btn" value="culture">#문화예술</button>
          <button id="traditional-btn" class="tag-btn" value="traditional">#전통역사</button>
        </div>
      </div>

      <!-- Festival grid -->
      <div class="festival-grid" id="festival-grid"></div>

      <!-- Pagination -->
      <div class="pagination-btns">
        <button id="prevBtn" class="page-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-left"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M15 6l-6 6l6 6" /></svg></button>
        <div class="pagination" id="pagination"></div>
          <button id="nextBtn" class="page-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-right"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M9 6l6 6l-6 6" /></svg></button>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/config.local.js"></script>
  <script src="js/supabase/config.local.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1"></script>
  <script src="js/supabase/client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/main-page.js"></script>
</body>
</html>

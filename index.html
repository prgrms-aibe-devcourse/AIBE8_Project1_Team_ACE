<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>축제 어때</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-root">
    <header id="site-header" class="site-header"></header>

    <main class="page-main">
      <!-- Filter bar -->
      <div class="filter-bar">
        <select class="filter-select" id="areaFilter">
          <option value="all">전체 ▾</option>
          <option value="서울특별시">서울특별시</option>
          <option value="경기">경기</option>
          <option value="강원">강원</option>
          <option value="부산">부산</option>
          <option value="울산">울산</option>
          <option value="광주">광주</option>
          <option value="전북">전북</option>
          <option value="경상북도">경상북도</option>
          <option value="경상남도">경상남도</option>
          <option value="충청남도">충청남도</option>
        </select>
        <select class="filter-select" id="periodFilter">
          <option value="all">전체 ▾</option>
          <option value="week">이번주</option>
        </select>
        <div class="tag-group">
          <button class="tag-btn">#여름먹거리</button>
          <button class="tag-btn">#문화예술</button>
          <button class="tag-btn">#체험행사</button>
        </div>
      </div>

      <!-- Festival grid -->
      <div class="festival-grid" id="festival-grid"></div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/config.local.js"></script>
  <script src="js/supabase/config.local.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1"></script>
  <script src="js/supabase/client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/main-page.js"></script>
</body>
</html>

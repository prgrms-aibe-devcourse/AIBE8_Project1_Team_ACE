<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>근처 편의시설 · 축제 어때</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-root">
    <header id="site-header" class="site-header"></header>

    <main class="page-nearby">
      <div class="summary-bar">
        <button class="summary-bar-back" id="back-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
        </button>
        <div>
          <span class="summary-title" id="festival-name"></span>
          <span class="summary-location" id="festival-location"></span>
        </div>
      </div>

      <div class="tab-bar" id="tab-bar"></div>
      <div class="place-list" id="place-list"></div>
      <div id="schedule-preview"></div>
    </main>

    <div class="fixed-bottom-bar">
      <div class="fixed-bottom-bar-inner">
        <p class="selection-count-text" id="selection-count"></p>
        <button class="btn-make-schedule" id="make-schedule-btn" disabled>일정 만들기</button>
      </div>
    </div>
  </div>

    <script src="js/utils.js"></script>
    <script src="js/supabase/config.local.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1"></script>
    <script src="js/supabase/client.js"></script>
    <script src="js/config.local.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/common.js"></script>
    <script src="js/nearby-page.js"></script>
</body>
</html>
